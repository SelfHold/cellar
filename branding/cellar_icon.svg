<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Cellar app icon: three database rows joined on the left, a node at the end of each.
       Colours from the design palette: bezel #000000, hm-bg #080c10, hm-accent #00d4ff. -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse" x="20" y="20">
      <path d="M24 0H0V24" fill="none" stroke="#00d4ff" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="28" fill="#000000"/>
  <rect x="20" y="20" width="216" height="216" rx="12" fill="#080c10"/>
  <rect x="20" y="20" width="216" height="216" rx="12" fill="url(#grid)"/>
  <path d="M60 68H180M60 128H180M60 188H180M60 68V188" fill="none" stroke="#00d4ff" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>
  <g fill="#00d4ff">
    <circle cx="196" cy="68" r="16" filter="url(#glow)" opacity="0.8"/>
    <circle cx="196" cy="128" r="16" filter="url(#glow)" opacity="0.8"/>
    <circle cx="196" cy="188" r="16" filter="url(#glow)" opacity="0.8"/>
    <circle cx="196" cy="68" r="16"/>
    <circle cx="196" cy="128" r="16"/>
    <circle cx="196" cy="188" r="16"/>
  </g>
  <g fill="#080c10">
    <circle cx="196" cy="68" r="6"/>
    <circle cx="196" cy="128" r="6"/>
    <circle cx="196" cy="188" r="6"/>
  </g>
</svg>
