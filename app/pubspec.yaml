name: cellar
description: Cellar — databases on your servers, over SSH.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  grpc: ^5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  ffi: ^2.1.4
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
