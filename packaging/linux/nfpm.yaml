# Linux packages (deb, rpm, archlinux) for Cellar. Built by `make package-linux`
# from the output of make build-linux (bundle in builds/linux); paths are relative to the repo root.
# The Flutter bundle is relocatable and finds its data next to the binary, so it
# stays together under /opt/selfhold/cellar. Icon and menu caches are refreshed by the
# package managers' own hooks (pacman hooks, dpkg and rpm file triggers).
name: cellar
arch: amd64
platform: linux
version: ${PKG_VERSION}
release: 1
section: database
priority: optional
maintainer: SelfHold <https://github.com/SelfHold>
vendor: SelfHold
homepage: https://github.com/SelfHold/cellar
license: GPL-3.0-only
description: |-
  Database manager: explorer, table editor and SQL consoles.
  PostgreSQL first, reached directly or over SSH.

contents:
  - src: builds/linux
    dst: /opt/selfhold/cellar
    type: tree
  - src: /opt/selfhold/cellar/cellar
    dst: /usr/bin/cellar
    type: symlink
  - src: packaging/linux/dev.selfhold.cellar.desktop
    dst: /usr/share/applications/dev.selfhold.cellar.desktop
    file_info: { mode: 0644 }
  - src: branding/cellar_icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.selfhold.cellar.svg
    file_info: { mode: 0644 }
  - src: app/assets/icon/cellar.png
    dst: /usr/share/icons/hicolor/256x256/apps/dev.selfhold.cellar.png
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/cellar/LICENSE
    packager: archlinux
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/cellar/copyright
    packager: deb
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/cellar/LICENSE
    type: license
    packager: rpm
    file_info: { mode: 0644 }

# Library names differ per distribution.
overrides:
  deb:
    depends:
      - "libgtk-3-0t64 | libgtk-3-0"
    recommends:
      - "xdg-utils"
  rpm:
    depends:
      - "gtk3"
    recommends:
      - "xdg-utils"
  archlinux:
    depends:
      - "gtk3"
